[workspace]
resolver = "3"
members = ["engine", "app"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Rune is pre-release: pin a rev of its `dev` branch, which is never rewritten.
rune = { git = "https://github.com/anomalyco/rune", rev = "55217838ad88551dcb64dba3085c9e96e058bd99", features = ["native-file-dialog"] }
rune-kit = { git = "https://github.com/anomalyco/rune", rev = "55217838ad88551dcb64dba3085c9e96e058bd99", features = ["markdown"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true
