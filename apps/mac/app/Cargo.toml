[package]
name = "open-notebook-mac"
description = "Open Notebook for macOS, drawn with Rune."
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "open-notebook"
path = "src/main.rs"

[dependencies]
notebook-engine = { path = "../engine" }
rune.workspace = true
rune-kit.workspace = true
serde.workspace = true
serde_json.workspace = true
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }

# Live talk (AVAudioEngine with voice processing) and Now Playing with media keys.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-avf-audio = { version = "0.3", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioEngine", "AVAudioFormat", "AVAudioIONode", "AVAudioMixerNode", "AVAudioMixing", "AVAudioNode", "AVAudioPlayerNode", "AVAudioTime", "AVAudioTypes", "objc2-core-audio-types"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSObject", "NSString", "NSValue"] }
objc2-media-player = { version = "0.3", default-features = false, features = ["std", "block2", "MPMediaItem", "MPNowPlayingInfoCenter", "MPRemoteCommand", "MPRemoteCommandCenter", "MPRemoteCommandEvent"] }
